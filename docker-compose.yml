services:
  postgres:
    image: postgres:16-alpine
    container_name: initialsgame-postgres
    environment:
      POSTGRES_DB: initialsgame
      POSTGRES_USER: initialsgame
      POSTGRES_PASSWORD: initialsgame
    ports:
      - "5432:5432"
    volumes:
      - initialsgame-pgdata:/var/lib/postgresql/data

volumes:
  initialsgame-pgdata:
